name: feedbackhub-pipeline

on: 
    push:
        branches: [main]
    workflow_dispatch:

jobs: 

    standard-build:

        strategy:
            matrix:
                dir_name: [frontend, backend]

        runs-on: ubuntu-latest

        steps:
            - name: checkout code
              uses: actions/checkout@v7.0.1

            - name: docker login 
              uses: docker/login-action@v2
              with:
                username: ${{ secrets.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_PASSWORD }}

            - name: docker buildx
              uses: docker/setup-buildx-action@v4.2.0

            - name: docker build and push
              if: matrix.dir_name == 'frontend'
              uses: docker/build-push-action@v7.3.0
              with:
                context: ./${{ matrix.dir_name }}
                push: true
                tags: docker.io/${{ secrets.DOCKER_USERNAME }}/feedbackhub-${{ matrix.dir_name }}:latest
                file: ./${{ matrix.dir_name }}/Dockerfile
                build-args: |
                    VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
            
            - name: docker build and push
              if: matrix.dir_name == 'backend'
              uses: docker/build-push-action@v7.3.0
              with:
                context: ./${{ matrix.dir_name }}
                push: true
                tags: docker.io/${{ secrets.DOCKER_USERNAME }}/feedbackhub-${{ matrix.dir_name }}:latest
                file: ./${{ matrix.dir_name }}/Dockerfile


            
    custom-build:
        needs: standard-build

        runs-on: self-hosted
        
        steps:
            - name: checkout code
              uses: actions/checkout@v7.0.1

            - name: copy env file
              run: |
                if [ -f ".env" ];then
                    echo ".env file already exists"
                else
                    cp .env.example .env
                fi

            - name: docker compose up
              run: |
                # docker compose down frontend backend
                # docker compose pull frontend backend
                docker compose up -d --build
                
